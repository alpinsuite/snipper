name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The version this project is developed and tested against. A green local run
  # only means a green CI run if these are the same number.
  FLUTTER_VERSION: 3.44.8

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Committed on purpose, so this can check they are not stale. A generated
      # file that drifts from its ARB is a translation that silently never
      # reaches the interface.
      - name: Localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated

      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: bash tools/check_hardcoded_strings.sh
      - run: flutter test

      # Same rule: the icons are generated from one drawing, and an output
      # edited by hand puts the platforms out of step at the next run.
      - name: Icons are current
        run: |
          dart run tools/make_icons.dart
          git diff --exit-code windows/runner/resources assets/icon packaging/icons

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
                                  libgtk-3-dev liblzma-dev

      - run: flutter pub get
      - run: flutter build linux --release

      # A build that produces no binary still exits zero often enough to be
      # worth asserting against.
      - name: The binary exists and runs
        run: |
          test -x build/linux/x64/release/bundle/snipper
          ls -la build/linux/x64/release/bundle/

      - name: The desktop entry is valid
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/snipper.desktop

      # The release binary, started on a real X server: it has to open, take a
      # capture from the command line, and ask the desktop for a region three
      # times over, with tools/fake_portal.py standing in for the desktop.
      # Until this existed the Linux build had never been launched at all —
      # only its capture channel had, by a test that draws no interface.
      - name: It opens, and captures
        env:
          # Xvfb has no DRI3, so Mesa probes for a device, fails, and limps on.
          # Asking for the software rasteriser outright skips the probe.
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          sudo apt-get install -y xvfb x11-utils x11-apps x11-xserver-utils \
                                  imagemagick xdotool libgl1-mesa-dri openbox \
                                  dbus python3-dbus python3-gi
          dbus-run-session -- \
            xvfb-run -a -s "-screen 0 1400x900x24 -noreset +extension GLX +render" \
              bash tools/smoke_linux.sh

      # Kept whether or not the step above passed: a smoke test can say the
      # window exists, and only a person can say it looks right.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snipper-linux-screenshot
          path: build/smoke/
          if-no-files-found: ignore

      - name: Software Bill of Materials
        # CycloneDX, resolved from pubspec.lock and written in the same job
        # that produced the binary, so it describes this build rather than
        # somebody's laptop. --check is the gate: it fails on a missing,
        # stale, or incomplete SBOM.
        run: |
          bash tools/sbom.sh
          bash tools/sbom.sh --check

      - uses: actions/upload-artifact@v4
        with:
          name: snipper-linux-x64
          path: |
            build/linux/x64/release/bundle/
            build/sbom.cdx.json

  capture-linux:
    name: Screen capture (X11, under Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Native toolchain and a virtual X server
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
                                  libgtk-3-dev liblzma-dev \
                                  xvfb x11-xserver-utils x11-apps

      - run: flutter pub get

      # The real runner and the real channel against a real X server, whose
      # root window is painted one known colour first. The test reads that
      # colour back out of the screenshot. GDK_BACKEND pins the X11 path; the
      # portal path needs a compositor and cannot run here.
      - name: Capture the root window and check the pixels
        env:
          GDK_BACKEND: x11
        run: |
          # -noreset: an X server with no clients left resets itself, and
          # xsetroot is the only client until the test starts. Without it the
          # colour is gone again before anything looks.
          xvfb-run -a -s "-screen 0 1600x900x24 -noreset" bash -c '
            xsetroot -solid "#336699"
            # What the X server itself says the last pixel of the root is, in
            # BGRX. If this is not 99 66 33 the test below is not at fault.
            xwd -root -silent | tail -c 4 | od -An -tx1
            flutter test integration_test/linux_capture_test.dart -d linux \
              --dart-define=SNIPPER_SCREEN=1600x900 \
              --dart-define=SNIPPER_ROOT_COLOUR=3368601
          '

      # The Wayland path is a D-Bus conversation with the desktop, and there is
      # no desktop here. tools/fake_portal.py owns the portal's name on a bus
      # private to this step and answers as the specification says: on time,
      # early, from a path of its own choosing, with a cancel, with a refusal,
      # and finally not at all. It proves this side of the conversation; only a
      # real GNOME or KDE session proves the other.
      - name: Ask a portal for a screenshot, every way it can answer
        run: |
          sudo apt-get install -y dbus python3-dbus python3-gi imagemagick
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24 -noreset" \
            bash tools/portal_test_linux.sh

  capture-gnome:
    name: Screen capture on GNOME (Ubuntu 24.04, Wayland)
    # Pinned, not ubuntu-latest: this is a test of what one release of GNOME
    # does, and the packages it installs are that release's.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
                                  libgtk-3-dev liblzma-dev

      - run: flutter pub get
      - run: flutter build linux --release

      # GNOME Shell with no screen, drawing into a virtual monitor, and the
      # portals Ubuntu 24.04 ships. tools/fake_portal.py answers the way the
      # specification says a portal does, and so it never showed that GNOME
      # asks the user first, and asks only for the focused window — which is
      # why a full-screen capture failed on every GNOME desktop in 0.1.0.
      - name: GNOME Shell and the portals Ubuntu 24.04 runs
        run: |
          sudo apt-get install -y --no-install-recommends \
            gnome-shell gsettings-desktop-schemas \
            dconf-gsettings-backend dconf-service \
            xdg-desktop-portal xdg-desktop-portal-gnome xdg-desktop-portal-gtk \
            dbus dbus-bin dbus-daemon python3-gi gir1.2-glib-2.0 gir1.2-gtk-3.0 \
            libgl1-mesa-dri libegl-mesa0 libgbm1 librsvg2-common \
            fonts-cantarell fonts-dejavu-core adwaita-icon-theme imagemagick

      # GNOME starts an application in a systemd scope named after it, and
      # the portal knows the application by that name. The runner's own user
      # manager is what lets the test start Snipper the same way.
      - name: The user's systemd, which GNOME starts applications under
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user is-system-running || true

      # The release that failed, which the test puts through the same steps
      # first: a rig that cannot make it fail cannot show that this passes.
      - name: Snipper 0.1.0, as released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/released
          gh release download v0.1.0 -R "${{ github.repository }}" \
            -p 'snipper-0.1.0-linux-x64.tar.gz' -D build/released
          tar -xzf build/released/*.tar.gz -C build/released

      - name: Capture the whole screen, every way a person asks
        timeout-minutes: 15
        run: |
          SNIPPER_RELEASED="$(find build/released -name snipper -type f -perm -u+x | head -1)" \
            bash tools/gnome/session.sh bash tools/gnome/fullscreen_test.sh

      # The question GNOME asked and the editor after each answer: a test can
      # measure colours, and only a person can say it looks right.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snipper-gnome-screenshots
          path: build/gnome/
          if-no-files-found: ignore
          # The session's HOME is all dot-directories: dconf, the permission
          # store's database, the installed desktop entry.
          include-hidden-files: true

  package:
    name: Package (.deb)
    runs-on: ubuntu-latest
    # The container the release is built in, by the same digest, so the package
    # tested here links against the glibc the released one will. See
    # release.yml for why it is a digest and how to move it.
    container: ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc   # 22.04
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git jq unzip xz-utils zip file \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            dpkg-dev desktop-file-utils

      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release
      - run: bash packaging/build_deb.sh

      # Installed for real, as root in a throwaway container: this is what
      # proves the computed Depends resolve on the oldest release supported,
      # and that every file lands where the desktop entry expects it.
      - name: The package installs
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./build/dist/snipper_*_amd64.deb
          test -x /usr/bin/snipper
          test -x /usr/lib/snipper/snipper
          test -f /usr/share/icons/hicolor/256x256/apps/snipper.png
          test -f /usr/share/metainfo/com.alpinsuite.snipper.metainfo.xml
          desktop-file-validate /usr/share/applications/snipper.desktop
          # Every shared library the binary wants is present once the
          # package's own dependencies are.
          ! LD_LIBRARY_PATH=/usr/lib/snipper/lib ldd /usr/lib/snipper/snipper | grep "not found"
          # Asked of dpkg rather than of the disk: the ubuntu image is configured
          # to drop man pages on install, so the file is rightly not there.
          dpkg -L snipper | grep -qx /usr/share/man/man1/snipper.1.gz

      - name: The version is written down once
        run: |
          VERSION="$(bash tools/set_version.sh)"
          grep -q "appVersion = '$VERSION'" lib/core/app_version.dart
          grep -q "<release version=\"$VERSION\"" packaging/com.alpinsuite.snipper.metainfo.xml
          dpkg-deb -f build/dist/snipper_*_amd64.deb Version | grep -qx "$VERSION"

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: The binary exists
        run: |
          if (-not (Test-Path build\windows\x64\runner\Release\snipper.exe)) {
            throw "no executable was produced"
          }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: snipper-windows-x64
          path: build/windows/x64/runner/Release/
